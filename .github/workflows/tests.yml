name: CDCAD tests

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CDCAD
        run: python -m pip install ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: Smoke-test the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          cdcad --version
          cdcad make box --size 2 3 4 -o smoke.stl
          cdcad inspect smoke.stl --require-solid
          cdcad make torus --major 10 --minor 3 -o smoke.3mf
          cdcad render smoke.3mf -o smoke.png --size 256
          cdcad describe text
