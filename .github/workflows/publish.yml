name: Publish

# Builds the package, and uploads it to PyPI when a GitHub release is published.
# Nothing is uploaded until PyPI trusts this workflow, so it is safe to leave as is.
#
# One-time setup when you want to publish:
#   1. On pypi.org, go to Your account > Publishing and add a pending publisher:
#        PyPI project name: cdcad    Owner: MilkmanAbi    Repository: CDCAD
#        Workflow name: publish.yml  Environment name: pypi
#      (For a dry run on test.pypi.org, do the same there with environment "testpypi".)
#   2. On GitHub, go to Settings > Environments and create "pypi" (and "testpypi").
#      Adding yourself as a required reviewer on "pypi" gives you a last chance to stop an upload.
#
# Each release:
#   1. Change VERSION in cdcad/_common.py and add the changes to CHANGELOG.md.
#   2. Commit, then tag it: git tag v0.5.0 && git push origin v0.5.0
#   3. Create a GitHub release from that tag. Publishing the release starts the upload.
#
# To build and check the files without uploading, run this workflow by hand with target "none".
# To try test.pypi.org first, run it by hand with target "testpypi".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload (none only builds and checks the files)
        type: choice
        options: [none, testpypi, pypi]
        default: none

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python -c "from cdcad._common import VERSION; print(VERSION)")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION $version in cdcad/_common.py"
            exit 1
          fi
      - name: Build the sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/cdcad/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/cdcad/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
